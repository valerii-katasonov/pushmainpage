# Мінімальний конфіг: вказуємо лише теку із серверними функціями.
# Налаштування публікації сайту навмисно не чіпаємо — вони лишаються
# такими, як задані в інтерфейсі Netlify.
[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# Браузер має ЩОРАЗУ перепитувати, чи не змінився файл.
#
# Без цього після деплою частина людей ще довго бачить стару збірку: сайт
# оновили, а в кабінеті нічого не змінилося. Ми на це наступали кілька
# разів поспіль і щоразу шукали помилку в коді, якої там не було.
#
# max-age=0 + must-revalidate не означає «качати щоразу»: якщо файл не
# змінився, сервер відповість «304 Not Modified» і трафіку майже не буде.
# Зате змінений файл доїде одразу, без бубна з очищенням кешу.
[[headers]]
  for = "/*.js"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# Нагадування класному керівнику про дні народження — раз на добу.
#
# Час у cron завжди за Гринвічем, тому 05:00 тут — це 7:00 у Варшаві влітку
# і 6:00 узимку. Рання година навмисна: сповіщення має чекати на вчителя
# зранку, а не прилітати серед уроку.
#
# Це єдине в порталі, що вмикається саме по собі. Якщо школа колись
# переносить сайт на інший хостинг — цей блок треба перенести теж,
# інакше нагадування тихо перестануть приходити (решта працюватиме).
[functions."birthday-reminders"]
  schedule = "0 5 * * *"

# ── СТАРА АДРЕСА ВЕДЕ НА НОВУ ──────────────────────────────────────
#
# Netlify НЕ редиректить свій піддомен на власний домен сам — ані коли
# новий домен призначено основним, ані після підтвердження сертифіката.
# Автоматично він робить це лише між apex і www. Тому правило потрібне
# явне, з повною адресою джерела: у звичайному `from = "/*"` Netlify
# бачить шлях, а не домен, і таке правило зациклило б сайт на себе.
#
# 301, а не 302: адреса змінилася назавжди, і пошуковики з браузерами
# мають запамʼятати нову. Знак оклику в `force` — щоб редирект спрацював
# і для адрес, за якими існує справжній файл (інакше старий домен і далі
# віддавав би cabinet.html, а не вів на новий).
#
# :splat переносить решту адреси: людина з закладкою на
# /cabinet?open=chat потрапить рівно туди ж на новому домені.
[[redirects]]
  from = "https://planlekcjipush.netlify.app/*"
  to = "https://push.school/:splat"
  status = 301
  force = true

# Між push.school і www.push.school правила НЕ пишемо: цю пару Netlify
# редиректить сам, у бік того домену, який позначено основним. Своє
# правило тут небезпечне — якщо основним колись стане www, воно почне
# тягнути в один бік, а Netlify в інший, і вийде нескінченний цикл.
