# Мінімальний конфіг: вказуємо лише теку із серверними функціями.
# Налаштування публікації сайту навмисно не чіпаємо — вони лишаються
# такими, як задані в інтерфейсі Netlify.
[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# Нагадування класному керівнику про дні народження — раз на добу.
#
# Час у cron завжди за Гринвічем, тому 05:00 тут — це 7:00 у Варшаві влітку
# і 6:00 узимку. Рання година навмисна: сповіщення має чекати на вчителя
# зранку, а не прилітати серед уроку.
#
# Це єдине в порталі, що вмикається саме по собі. Якщо школа колись
# переносить сайт на інший хостинг — цей блок треба перенести теж,
# інакше нагадування тихо перестануть приходити (решта працюватиме).
[functions."birthday-reminders"]
  schedule = "0 5 * * *"
